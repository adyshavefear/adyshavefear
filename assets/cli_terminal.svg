<svg width="680" height="260" viewBox="0 0 680 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Window Background -->
  <rect width="680" height="260" rx="10" fill="#0A0A0F" stroke="#1F2335" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect width="680" height="38" rx="10" fill="#12131C"/>
  <rect y="28" width="680" height="10" fill="#12131C"/>
  <line x1="0" y1="38" x2="680" y2="38" stroke="#1F2335" stroke-width="1"/>
  
  <!-- Window Controls -->
  <circle cx="22" cy="19" r="6" fill="#FF5F56"/>
  <circle cx="42" cy="19" r="6" fill="#FFBD2E"/>
  <circle cx="62" cy="19" r="6" fill="#27C93F"/>
  
  <!-- Window Title -->
  <text x="340" y="23" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" fill="#8B949E" text-anchor="middle">adys@archlinux: ~/workspace (abz-ai)</text>
  
  <!-- Terminal Text -->
  <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13" xml:space="preserve">
    <!-- Prompt 1 -->
    <text x="24" y="68">
      <tspan fill="#27C93F" font-weight="700">adys@arch</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#E6EDF3">$ abz ai --prompt &quot;system check &amp; database health&quot;</tspan>
    </text>
    
    <!-- Output lines -->
    <text x="24" y="96" fill="#E50914" font-weight="600">&#x25BA; [AI RUNTIME] Initializing neural terminal agent...</text>
    <text x="24" y="122">
      <tspan fill="#00F0FF">&#x2714; OS &amp; Kernel</tspan>    <tspan fill="#8B949E">:</tspan> <tspan fill="#E6EDF3">Linux 6.11 (Arch Linux x86_64) | Shell: /bin/bash</tspan>
    </text>
    <text x="24" y="146">
      <tspan fill="#00F0FF">&#x2714; Database Core</tspan> <tspan fill="#8B949E">:</tspan> <tspan fill="#E6EDF3">Oracle Database &amp; APEX 24.1 [ACTIVE - 0 ORA ERRORS]</tspan>
    </text>
    <text x="24" y="170">
      <tspan fill="#00F0FF">&#x2714; CLI Platform</tspan>  <tspan fill="#8B949E">:</tspan> <tspan fill="#E6EDF3">ABZSS Engine v2.0 (TypeScript / Node runtime)</tspan>
    </text>
    <text x="24" y="196">
      <tspan fill="#27C93F" font-weight="600">&#x25C6; [AGENT RESPONSE]</tspan> <tspan fill="#A5D6FF">&quot;All services nominal. Autonomous audit active. Ready to build.&quot;</tspan>
    </text>
    
    <!-- Prompt 2 with cursor -->
    <text x="24" y="230">
      <tspan fill="#27C93F" font-weight="700">adys@arch</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#00F0FF">~</tspan><tspan fill="#E6EDF3">$</tspan> <tspan fill="#00F0FF">_</tspan>
    </text>
  </g>
</svg>
